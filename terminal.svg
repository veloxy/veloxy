    <text x="24" y="324"><tspan fill="#3fb950">veloxy@github</tspan>:<tspan fill="#58a6ff">~</tspan>&gt; http get https://sourcebox.be</text>
    <!-- prompt: cursor -->
    <text x="24" y="345"><tspan fill="#3fb950">veloxy@github</tspan>:<tspan fill="#58a6ff">~</tspan>&gt; <tspan fill="#e6edf3">▌<animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/></tspan></text>
