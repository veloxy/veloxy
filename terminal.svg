<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 376" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <!-- window -->
  <rect x="0.5" y="0.5" width="699" height="375" rx="10" fill="#161b22" stroke="#30363d"/>
