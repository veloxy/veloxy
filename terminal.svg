  <line x1="0.5" y1="39.5" x2="699.5" y2="39.5" stroke="#30363d"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="350" y="25" text-anchor="middle" fill="#7d8590" font-size="12">ghostty — veloxy@github: ~</text>

  <g xml:space="preserve" fill="#e6edf3">
