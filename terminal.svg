      <text x="24" y="114">           __</text>
      <text x="24" y="135"> _  _____ / /__ __ ____ __</text>
      <text x="24" y="156">| |/ / -_) / _ \\ \ / // /</text>
      <text x="24" y="177">|___/\__/_/\___/_\_\\_, /</text>
      <text x="24" y="198">                   /___/</text>
    </g>

    <!-- info column -->
    <text x="270" y="114"><tspan fill="#56d4dd" font-weight="bold">veloxy@github</tspan></text>
    <text x="270" y="135"><tspan fill="#56d4dd">─────────────</tspan></text>
    <text x="270" y="156"><tspan fill="#56d4dd" font-weight="bold">OS:</tspan>        macOS</text>
    <text x="270" y="177"><tspan fill="#56d4dd" font-weight="bold">Uptime:</tspan>    15+ years on GitHub</text>
    <text x="270" y="198"><tspan fill="#56d4dd" font-weight="bold">Shell:</tspan>     nushell</text>
    <text x="270" y="219"><tspan fill="#56d4dd" font-weight="bold">Editor:</tspan>    PhpStorm</text>
    <text x="270" y="240"><tspan fill="#56d4dd" font-weight="bold">Terminal:</tspan>  Ghostty</text>
    <text x="270" y="261"><tspan fill="#56d4dd" font-weight="bold">Languages:</tspan> PHP · JS/TS · a long tail of others</text>
    <text x="270" y="282"><tspan fill="#56d4dd" font-weight="bold">Locale:</tspan>    nl_BE.UTF-8 · en_US.UTF-8</text>

